<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Wardrobe</title>
<style>
  :root {
    --bg: #f3efe8;
    --ink: #1f2a37;
    --muted: #6b7280;
    --accent: #2f4a6d;
    --card: #ffffff;
    --err: #9b2c2c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161a20;
      --ink: #e8eaed;
      --muted: #9aa3af;
      --accent: #8fb0d9;
      --card: #20262e;
      --err: #f0a0a0;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: Georgia, "Times New Roman", serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 16px;
  }
  h1 { font-size: 2.2rem; font-weight: 600; margin: 0 0 6px; }
  p.sub { margin: 0 0 24px; color: var(--muted); }
  .search { display: flex; gap: 8px; width: 100%; max-width: 380px; }
  input {
    flex: 1;
    padding: 12px 14px;
    font-size: 1rem;
    border: 1px solid var(--muted);
    border-radius: 8px;
    background: var(--card);
    color: var(--ink);
  }
  button {
    padding: 12px 18px;
    font-size: 1rem;
    border: 0;
    border-radius: 8px;
    background: var(--accent);
    color: var(--bg);
    cursor: pointer;
  }
  input:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #result { margin-top: 28px; width: 100%; max-width: 480px; text-align: center; }
  #result img {
    max-width: 100%;
    max-height: 70vh;
    border-radius: 10px;
    background: var(--card);
  }
  .caption { margin-top: 10px; color: var(--muted); }
  .error { color: var(--err); font-size: 1.1rem; }
</style>
</head>
<body>
  <h1>My Wardrobe</h1>
  <p class="sub">Enter a number from 1 to 40.</p>

  <div class="search">
    <input id="num" type="text" inputmode="numeric" placeholder="e.g. 9" aria-label="Picture number">
    <button id="go">Search</button>
  </div>

  <div id="result" aria-live="polite"></div>

<script>
  const input = document.getElementById("num");
  const result = document.getElementById("result");

  function search() {
    const value = input.value.trim();
    result.innerHTML = "";

    if (!/^\d+$/.test(value)) {
      result.innerHTML = '<p class="error">Please enter a number.</p>';
      return;
    }

    const n = String(parseInt(value, 10)); // "09" -> "9"
    const img = new Image();
    img.alt = "Wardrobe picture " + n;
    img.onload = () => {
      result.innerHTML = "";
      result.appendChild(img);
      const cap = document.createElement("div");
      cap.className = "caption";
      cap.textContent = "Picture " + n;
      result.appendChild(cap);
    };
    img.onerror = () => {
      result.innerHTML = '<p class="error">Picture ' + n + " isn’t available.</p>";
    };
    img.src = "Wears/" + n + ".jpg";
  }

  document.getElementById("go").addEventListener("click", search);
  input.addEventListener("keydown", e => { if (e.key === "Enter") search(); });
</script>
</body>
</html>
